name: Deploy to AWS

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: 'Apply Terraform changes?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  sync-website:
    name: Sync website to S3 and invalidate CloudFront
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: github-actions-deploy

      - name: Get S3 bucket name from Terraform
        id: tf_outputs
        run: |
          set -euo pipefail
          cd terraform
          terraform init -reconfigure
          terraform output -json > tf-output.json 2>/tmp/tf-output.err
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          with Path('tf-output.json').open() as f:
              data = json.load(f)

          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write(f"bucket_name={data['s3_bucket_name']['value']}\n")
              out.write(f"distribution_id={data['cloudfront_distribution_id']['value']}\n")
          PY

      - name: Sync website files to S3
        run: |
          aws s3 sync public/ s3://${{ steps.tf_outputs.outputs.bucket_name }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.distribution_id }} \
            --paths "/*"

      - name: Deployment Success
        run: echo "✅ Website deployed successfully!"

  apply-terraform:
    name: Apply Terraform changes (manual dispatch)
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_terraform == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: github-actions-terraform

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
