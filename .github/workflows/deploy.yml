name: Deploy to AWS

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: 'Apply Terraform changes?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  sync-website:
    name: Sync website to S3 and invalidate CloudFront
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: github-actions-deploy

      - name: Prepare Terraform outputs
        run: |
          set -euo pipefail
          cd terraform
          terraform init -reconfigure
          terraform output -json > tf-output.raw 2>/tmp/tf-output.err || {
            echo "Terraform output failed"
            cat /tmp/tf-output.err || true
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path

          raw = Path('tf-output.raw').read_text(encoding='utf-8')
          clean = '\n'.join(line for line in raw.splitlines() if not line.startswith('::'))
          Path('tf-output.clean.json').write_text(clean, encoding='utf-8')
          PY

      - name: Sync website files to S3
        run: |
          set -euo pipefail
          cd terraform
          BUCKET_NAME=$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('tf-output.clean.json').read_text(encoding='utf-8'))
          print(data['s3_bucket_name']['value'])
          PY
          )
          aws s3 sync ../public/ "s3://${BUCKET_NAME}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          cd terraform
          DIST_ID=$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('tf-output.clean.json').read_text(encoding='utf-8'))
          print(data['cloudfront_distribution_id']['value'])
          PY
          )
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

      - name: Deployment Success
        run: echo "✅ Website deployed successfully!"

  apply-terraform:
    name: Apply Terraform changes (manual dispatch)
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_terraform == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: github-actions-terraform

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
